[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minivllm-runtime"
version = "0.1.0"
description = "A compact vLLM v1-style multiprocess inference runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = [
    "torch>=2.2",
    "safetensors>=0.4",
    "transformers>=4.40",
]

[project.scripts]
minivllm-api = "minivllm.entrypoints.api_server:main"

[tool.setuptools.packages.find]
include = ["minivllm*"]
